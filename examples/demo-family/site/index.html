<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>家庭保险总览</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f5ef;
      --panel: #fffdf8;
      --ink: #1f2a32;
      --muted: #63707b;
      --line: #d8d5ca;
      --line-strong: #a9a397;
      --green: #2f6f4f;
      --blue: #315f7d;
      --amber: #b17422;
      --red: #9a4b42;
      --paper-shadow: 0 16px 44px rgba(36, 42, 45, .12);
      --radius: 8px;
      --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      --serif: "Songti SC", "Noto Serif CJK SC", "STSong", Georgia, serif;
      font-family: var(--serif);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background:
        linear-gradient(90deg, rgba(49, 95, 125, .06) 1px, transparent 1px),
        linear-gradient(0deg, rgba(49, 95, 125, .05) 1px, transparent 1px),
        var(--bg);
      background-size: 28px 28px;
      color: var(--ink);
    }

    button, input { font: inherit; }

    .app {
      width: min(1220px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 420px);
      gap: 22px;
      align-items: start;
      padding: 18px 0 22px;
      border-bottom: 2px solid var(--ink);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--blue);
      font: 700 13px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 64px);
      line-height: .96;
    }

    .header-actions {
      position: relative;
      display: flex;
      justify-content: flex-end;
      justify-self: end;
      width: 100%;
      max-width: 220px;
    }

    .top-unlock { font-family: var(--sans); }

    .unlock-toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--ink);
      border-radius: var(--radius);
      background: var(--ink);
      color: #fffdf8;
      padding: 10px 15px;
      cursor: pointer;
    }

    .unlock-toggle svg { width: 14px; height: 14px; flex: none; }
    .unlock-toggle:hover { background: var(--blue); border-color: var(--blue); }
    .unlock-toggle:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .unlock-toggle:disabled { opacity: .6; cursor: default; }
    .unlock-toggle:disabled:hover { background: var(--ink); border-color: var(--ink); }

    .unlock-popover {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 10;
      width: min(360px, calc(100vw - 28px));
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, .98);
      box-shadow: var(--paper-shadow);
      padding: 12px;
    }

    .unlock-popover[hidden] { display: none; }

    .unlock-hint {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .unlock-form {
      display: grid;
      grid-template-columns: minmax(160px, 1fr) auto;
      gap: 10px;
      align-items: start;
    }

    .unlock-form input,
    .search {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--panel);
      padding: 11px 12px;
      color: var(--ink);
      outline: none;
    }

    .unlock-form input:focus-visible,
    .search:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

    .unlock-form button {
      border: 1px solid var(--ink);
      border-radius: var(--radius);
      background: var(--ink);
      color: #fffdf8;
      padding: 11px 14px;
      cursor: pointer;
    }

    .unlock-form button:hover,
    .unlock-form button:focus-visible { background: var(--blue); border-color: var(--blue); }

    .unlock-message {
      min-height: 20px;
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .unlock-message.error { color: var(--red); }

    .overview-panel {
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, .94);
      box-shadow: var(--paper-shadow);
      margin: 18px 0;
      padding: 16px;
      font-family: var(--sans);
    }

    .overview-panel h2 {
      margin: 0 0 10px;
      font-family: var(--serif);
      font-size: 26px;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
    }

    .overview-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      background: rgba(246, 245, 239, .6);
    }

    .overview-card strong {
      display: block;
      margin-bottom: 8px;
      font-size: 16px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .legend {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.6;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 26px;
      border-radius: 999px;
      padding: 4px 9px;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 650;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .badge b { font-weight: 500; opacity: .8; }
    .badge.ok { color: #1f513b; background: rgba(47, 111, 79, .12); border-color: rgba(47, 111, 79, .3); }
    .badge.warn { color: #7f4e18; background: rgba(177, 116, 34, .14); border-color: rgba(177, 116, 34, .32); }
    .badge.bad { color: #893b34; background: rgba(154, 75, 66, .12); border-color: rgba(154, 75, 66, .3); }
    .badge.muted { color: var(--muted); background: rgba(99, 112, 123, .08); border-color: rgba(99, 112, 123, .25); }
    .badge.plain { color: var(--ink); background: transparent; border-color: var(--line-strong); font-weight: 500; }

    .locked-detail[hidden] { display: none; }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto;
      gap: 12px;
      align-items: center;
      margin: 18px 0;
      font-family: var(--sans);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: flex-end;
    }

    .filter {
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink);
      padding: 8px 11px;
      cursor: pointer;
    }

    .filter.active { background: var(--ink); color: #fffdf8; border-color: var(--ink); }

    .filter:hover,
    .member-button:hover { border-color: var(--ink); }

    .filter:focus-visible,
    .member-button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

    .layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    aside, .content { min-width: 0; }

    .member-list {
      display: grid;
      gap: 8px;
      position: sticky;
      top: 12px;
      font-family: var(--sans);
    }

    .member-button {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, .88);
      padding: 11px 12px;
      text-align: left;
      color: var(--ink);
      cursor: pointer;
    }

    .member-button.active { border-color: var(--ink); box-shadow: 5px 5px 0 rgba(31, 42, 50, .1); }

    .member-button small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .count {
      min-width: 28px;
      min-height: 28px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: var(--ink);
      color: #fffdf8;
      font-size: 12px;
      font-weight: 700;
    }

    .member-section {
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, .94);
      box-shadow: var(--paper-shadow);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .member-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: end;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .member-head h2 { margin: 0; font-size: 27px; line-height: 1.05; }

    .member-note {
      margin: 6px 0 0;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.5;
    }

    .gap-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--sans);
      font-size: 13px;
    }

    th, td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: left;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      background: rgba(246, 245, 239, .72);
      white-space: nowrap;
    }

    td:first-child { min-width: 200px; font-weight: 700; }
    tbody tr:hover { background: rgba(49, 95, 125, .05); }
    td.amount { min-width: 64px; }
    td.premium { min-width: 96px; }
    td.advice { min-width: 180px; }

    .policy-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      white-space: nowrap;
    }

    .resource-list {
      display: grid;
      gap: 5px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .resource-list + .resource-list {
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px dashed var(--line);
    }

    .resource-list li { color: var(--muted); line-height: 1.45; }

    .resource-list a {
      color: var(--blue);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .empty {
      padding: 18px;
      color: var(--muted);
      font-family: var(--sans);
    }

    .site-footer {
      margin-top: 28px;
      padding-top: 14px;
      border-top: 1px solid var(--line-strong);
      color: var(--muted);
      font-family: var(--sans);
      font-size: 12.5px;
      line-height: 1.6;
    }

    .site-footer p { margin: 0 0 4px; }

    @media (max-width: 860px) {
      header, .toolbar, .layout, .member-head { grid-template-columns: 1fr; }
      .header-actions { justify-self: stretch; max-width: none; justify-content: flex-start; }
      .unlock-popover { left: 0; right: auto; }
      .filters, .gap-row { justify-content: flex-start; }
      .member-list {
        position: static;
        display: flex;
        overflow-x: auto;
        padding-bottom: 6px;
      }
      .member-button { flex: 0 0 auto; width: auto; }
      .member-button small { display: none; }
    }

    @media (max-width: 720px) {
      .table-wrap { overflow: visible; }
      table, tbody, tr, td { display: block; }
      thead {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      tbody tr { padding: 10px 0; }
      tbody tr:hover { background: transparent; }
      td { border-bottom: none; padding: 5px 14px; }
      td::before {
        content: attr(data-label);
        display: block;
        margin-bottom: 2px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }
      td:first-child { min-width: 0; }
    }

    @media (max-width: 560px) {
      .app { width: min(100% - 18px, 1220px); padding-top: 14px; }
      .unlock-form { grid-template-columns: 1fr; }
      .unlock-popover { position: static; width: 100%; margin-top: 8px; }
    }
  </style>
</head>

        <aside>

        <section class="content" data-content></section>

      <p>生成日期：<span data-generated-at>待补</span></p>
    </footer>
  </main>

    const PENDING = "待补";
    const KINDS = ["寿险", "重疾", "医疗", "意外", "年金"];
    // 档位配色的唯一来源：总览、明细档位、保单档位都查这张表。
    // 第三项是「核保」开头那一档，写成 \u 转义：明文页面里不出现这个档位的字面，隐私检查可以直接按字面搜。
    const TIER_CLASS = {
      "充分": "ok",
      "一般": "warn",
      "\u6838\u4fdd\u53d7\u9650": "warn",
      "不足": "bad",
      "缺资料": "muted",
      "不适用": "muted"
    };

    function tierClass(tier) {
      return TIER_CLASS[show(tier)] || "muted";
    }

    let MEMBERS = [];
    let detailControlsWired = false;
    const state = { type: "all", query: "", member: "all" };

    function show(value) {
      return value === null || value === void 0 || String(value).trim() === "" ? PENDING : String(value);
    }

    function escapeHtml(value) {
      return show(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function list(value) {
      return Array.isArray(value) ? value : [];
    }

    function renderOverview() {
      const grid = document.querySelector("[data-overview-grid]");
      const members = list(DASHBOARD_OVERVIEW.members);
      grid.innerHTML = members.map((member) => {
        const coverage = member.coverage || {};
        const chips = KINDS.map((kind) => {
          const tier = show(coverage[kind]);
          return `<span class="badge ${tierClass(tier)}"><b>${escapeHtml(kind)}</b>${escapeHtml(tier)}</span>`;
        }).join("");
        return `<div class="overview-card"><strong>${escapeHtml(member.name)}</strong><div class="chips">${chips}</div></div>`;
      }).join("") || '<div class="empty">暂无成员。</div>';
      document.querySelector("[data-generated-at]").textContent = show(DASHBOARD_OVERVIEW.generatedAt);
    }

    function matchesPolicy(policy, member) {
      const typeMatched = state.type === "all" || show(policy.type).includes(state.type);
      const text = [
        member.name, member.role, policy.name, policy.code, policy.company,
        policy.type, policy.policyId, policy.premium, policy.term, policy.note,
        policy.sumInsured, policy.renewal
      ].map(show).join(" ").toLowerCase();
      return typeMatched && text.includes(state.query.toLowerCase());
    }

    function visibleMembers() {
      return MEMBERS.map((member) => ({
        ...member,
        policies: list(member.policies).filter((policy) => matchesPolicy(policy, member))
      })).filter((member) => {
        if (state.member !== "all" && state.member !== member.id) return false;
        if (state.query || state.type !== "all") return member.policies.length > 0;
        return true;
      });
    }

    function renderMemberList() {
      const nav = document.querySelector("[data-member-list]");
      const total = MEMBERS.reduce((sum, member) => sum + list(member.policies).length, 0);
      const items = [
        { id: "all", name: "全部成员", role: "查看所有保单", count: total },
        ...MEMBERS.map((member) => ({ id: member.id, name: member.name, role: member.role, count: list(member.policies).length }))
      ];
      nav.innerHTML = items.map((item) => `
        <button class="member-button ${state.member === item.id ? "active" : ""}" type="button" data-member="${escapeHtml(item.id)}">
          <span>${escapeHtml(item.name)}<small>${escapeHtml(item.role)}</small></span>
          <span class="count">${escapeHtml(item.count)}</span>
        </button>
      `).join("");
      nav.querySelectorAll("[data-member]").forEach((button) => {
        button.addEventListener("click", () => {
          state.member = button.dataset.member;
          render();
        });
      });
    }

    function renderLinkList(items) {
      const entries = list(items);
      if (entries.length === 0) return "";
      return `<ul class="resource-list">${entries.map((item) => {
        if (typeof item === "string") return `<li>${escapeHtml(item)}</li>`;
        if (!item.href) return `<li>${escapeHtml(item.label)}</li>`;
        return `<li><a href="${escapeHtml(item.href)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.label)}</a></li>`;
      }).join("")}</ul>`;
    }

    function renderPolicyResources(policy) {
      const html = [policy.contacts, policy.links, policy.documents].map(renderLinkList).filter(Boolean).join("");
      return html || `<span class="member-note">${PENDING}</span>`;
    }

    function renderPolicies(member) {
      if (member.policies.length === 0) return '<div class="empty">当前筛选下没有保单。</div>';
      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>保单</th>
                <th>险种 / 档位</th>
                <th>保单号</th>
                <th>保额</th>
                <th>年保费</th>
                <th>保障期限</th>
                <th>生效日 / 下次交费日</th>
                <th>联系方式</th>
                <th>调整建议</th>
              </tr>
            </thead>
            <tbody>
              ${member.policies.map((policy) => `
                <tr>
                  <td data-label="保单">${escapeHtml(policy.name)}<br><span class="member-note">${escapeHtml(policy.company)} · ${escapeHtml(policy.code)}</span></td>
                  <td data-label="险种 / 档位"><span class="badge plain">${escapeHtml(policy.type)}</span> <span class="badge ${tierClass(policy.status)}">${escapeHtml(policy.status)}</span></td>
                  <td data-label="保单号" class="policy-id">${escapeHtml(policy.policyId)}</td>
                  <td data-label="保额" class="amount">${escapeHtml(policy.sumInsured)}</td>
                  <td data-label="年保费" class="premium">${escapeHtml(policy.premium)}</td>
                  <td data-label="保障期限">${escapeHtml(policy.term)}</td>
                  <td data-label="生效日 / 下次交费日">${escapeHtml(policy.renewal)}</td>
                  <td data-label="联系方式">${renderPolicyResources(policy)}</td>
                  <td data-label="调整建议" class="advice">${escapeHtml(policy.note)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderContent() {
      const content = document.querySelector("[data-content]");
      content.innerHTML = visibleMembers().map((member) => `
        <article class="member-section">
          <div class="member-head">
            <div>
              <h2>${escapeHtml(member.name)}</h2>
              <p class="member-note">${escapeHtml(member.role)}｜${escapeHtml(member.note)}</p>
            </div>
            <div class="gap-row">
              ${list(member.gaps).map((gap) => `<span class="badge ${tierClass(gap.tier)}">${escapeHtml(gap.kind)}：${escapeHtml(gap.tier)}</span>`).join("")}
            </div>
          </div>
          ${renderPolicies(member)}
        </article>
      `).join("") || '<div class="member-section empty">没有匹配结果。</div>';
    }

    function render() {
      document.querySelectorAll("[data-type]").forEach((button) => {
        button.classList.toggle("active", button.dataset.type === state.type);
      });
      renderMemberList();
      renderContent();
    }

    function base64ToBytes(value) {
      return Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
    }

    async function unlockDetail(password) {
      const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(ENCRYPTED_DASHBOARD.salt),
          iterations: ENCRYPTED_DASHBOARD.iterations,
          hash: ENCRYPTED_DASHBOARD.hash
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(ENCRYPTED_DASHBOARD.iv) },
        key,
        base64ToBytes(ENCRYPTED_DASHBOARD.ciphertext)
      );
      return JSON.parse(new TextDecoder().decode(plain));
    }

    function wireDetailControls() {
      if (detailControlsWired) return;
      detailControlsWired = true;
      document.querySelector("[data-search]").addEventListener("input", (event) => {
        state.query = event.target.value.trim();
        renderContent();
      });
      document.querySelectorAll("[data-type]").forEach((button) => {
        button.addEventListener("click", () => {
          state.type = button.dataset.type;
          render();
        });
      });
    }

    const unlockToggle = document.querySelector("[data-unlock-toggle]");
    const unlockPanel = document.querySelector("[data-unlock-panel]");

    function closeUnlockPanel() {
      unlockPanel.hidden = true;
      unlockToggle.setAttribute("aria-expanded", "false");
    }

    unlockToggle.addEventListener("click", () => {
      const willOpen = unlockPanel.hidden;
      unlockPanel.hidden = !willOpen;
      unlockToggle.setAttribute("aria-expanded", String(willOpen));
      if (willOpen) document.querySelector("[data-password]").focus();
    });

    document.addEventListener("click", (event) => {
      if (!unlockPanel.hidden && !event.target.closest(".top-unlock")) closeUnlockPanel();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !unlockPanel.hidden) {
        closeUnlockPanel();
        unlockToggle.focus();
      }
    });

    document.querySelector("[data-unlock-form]").addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = document.querySelector("[data-unlock-message]");
      const password = document.querySelector("[data-password]").value;
      message.classList.remove("error");
      if (!ENCRYPTED_DASHBOARD) {
        message.classList.add("error");
        message.textContent = "本页没有加密明细。";
        return;
      }
      if (!window.crypto || !window.crypto.subtle) {
        message.classList.add("error");
        message.textContent = "当前浏览器不支持本地解密。";
        return;
      }
      message.textContent = "正在解锁…";
      try {
        const detail = await unlockDetail(password);
        MEMBERS = list(detail.members);
        document.querySelector("[data-locked-detail]").hidden = false;
        closeUnlockPanel();
        unlockToggle.textContent = "已解锁";
        unlockToggle.disabled = true;
        message.textContent = "";
        wireDetailControls();
        render();
      } catch (error) {
        message.classList.add("error");
        message.textContent = "口令不对，请重试";
      }
    });

    renderOverview();
  </script>
